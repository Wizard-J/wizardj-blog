<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>微信机器人 · 博客后台</title>
  <link rel="stylesheet" href="/assistant/chat.css">
  <link rel="stylesheet" href="status.css">
  <script src="status.js" defer></script>
</head>
<body>
  <header class="app-header"><a class="toolbar-button" href="/assistant/?persona=wizard">返回博客后台</a></header>
  <main class="bot-status">
    <div class="status-heading">
      <h1>微信机器人</h1>
      <button class="toolbar-button" id="refresh" type="button">刷新</button>
    </div>
    <p id="notice" role="status">正在读取状态…</p>
    <dl class="status-grid">
      <div><dt>运行状态</dt><dd id="state">—</dd></div>
      <div><dt>当前模型</dt><dd id="model">—</dd></div>
      <div><dt>OpenAI API 项目</dt><dd id="project">—</dd></div>
      <div><dt>最近模型回复</dt><dd id="generated">—</dd></div>
      <div><dt>最近微信接口接受</dt><dd id="accepted">—</dd></div>
      <div><dt>最近失败</dt><dd id="failure">—</dd></div>
    </dl>
    <section aria-labelledby="events-title">
      <h2 id="events-title">最近活动</h2>
      <p class="status-note">显示最近 7 天的回复和失败事件。微信接口接受后，手机端送达状态仍需在微信确认。</p>
      <ul class="event-list" id="events"></ul>
      <p id="empty" hidden>过去 7 天暂无记录。</p>
    </section>
  </main>
</body>
</html>
