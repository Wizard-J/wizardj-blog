<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>博客助手登录 · WizardJ</title>
  <link rel="stylesheet" href="/assistant/login.css">
</head>
<body>
  <main>
    <a class="back" href="/">← 返回博客</a>
    <section aria-labelledby="title">
      <h1 id="title">博客助手登录</h1>
      <p>请使用站长账号登录。</p>
      <!-- message -->
      <form method="post" action="/assistant/login">
        <input type="hidden" name="next" value="{{next}}">
        <div>
          <label for="username">用户名</label>
          <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="256" required>
        </div>
        <div>
          <label for="password">密码</label>
          <input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required>
        </div>
        <button type="submit">登录</button>
      </form>
    </section>
  </main>
</body>
</html>
