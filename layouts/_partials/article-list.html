<ul class="article-list">
{{ range .Pages }}
  <li>{{ with .Date }}<time datetime="{{ .Format "2006-01-02" }}">{{ .Format "2006-01-02" }}</time>{{ end }}
  <a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></li>
{{ end }}
</ul>
{{ if gt .TotalPages 1 }}
<nav class="pagination" aria-label="分页">
  {{ if .HasPrev }}<a href="{{ .Prev.URL }}">上一页</a>{{ else }}<span></span>{{ end }}
  <span>{{ .PageNumber }} / {{ .TotalPages }}</span>
  {{ if .HasNext }}<a href="{{ .Next.URL }}">下一页</a>{{ else }}<span></span>{{ end }}
</nav>
{{ end }}
